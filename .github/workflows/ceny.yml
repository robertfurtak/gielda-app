name: Ceny w marketach
on:
  schedule:
    - cron: '15 3 * * *'   # codziennie ok. 4:15 czasu polskiego
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ceny/scraper/**']
permissions:
  contents: write
concurrency:
  group: ceny
  cancel-in-progress: false
jobs:
  pobierz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node ceny/scraper/scrape.mjs ceny/ceny.json
      - name: Zapisz dane
        run: |
          git config user.name "ceny-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ceny/ceny.json
          git diff --cached --quiet && exit 0
          git commit -m "Ceny w marketach $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i*10))
          done
          exit 1
